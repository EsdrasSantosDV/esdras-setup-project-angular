<!-- src/app/recursos/orders/orders-list.component.html -->
<header class="topo">
  <h1>🍽️ Pedidos</h1>
  <p class="sub">Listagem + atualização de status em tempo real</p>
</header>

<main class="conteudo" *ngIf="pedidos$ | async as pedidos">
  <section class="grade">
    <article class="cartao" *ngFor="let p of pedidos; trackBy: rastrearPorId">
      <header class="cartao__topo">
        <div>
          <div class="pedido-id">#{{ p.id }}</div>
          <div class="cliente">{{ p.customer }}</div>
        </div>
        <span [class]="classeStatus(p.status)">{{ p.status }}</span>
      </header>

      <ul class="itens">
        <li class="item" *ngFor="let it of p.items">
          <span class="prato">{{ it.dish }}</span>
          <span class="qtd">x{{ it.qty }}</span>
        </li>
      </ul>

      <footer class="meta">
        <span>criado em {{ p.createdAt }}</span>
      </footer>
    </article>
  </section>

  <p class="vazio" *ngIf="pedidos.length === 0">Nenhum pedido por enquanto.</p>
</main>
