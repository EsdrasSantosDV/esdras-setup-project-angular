<div class="form-container">
  <h2>Formulário com FormControl</h2>
  <form class="bg-gray-300 w-2/4 p-3 rounded">
    <input
      id="textInput"
      type="text"
      [formControl]="textControl"
      placeholder="Digite algo aqui"
      class="rounded p-2 w-2/4"
    />
  </form>
  <p class="bg-gray-300 w-2/4 p-3 mt-4 rounded" *ngIf="textControl.value">
    Texto digitado em tempo real: <strong>{{ valueChange$ | async }}</strong>
  </p>
</div>
