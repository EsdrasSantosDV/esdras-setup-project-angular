<div class="max-w-sm mx-auto mt-10 p-6 bg-white shadow-lg rounded-xl">
  <label for="search" class="block text-sm font-semibold text-gray-600 mb-2">
    Buscar por nome
  </label>

  <input
    id="search"
    type="text"
    placeholder="Pesquise aqui..."

  <p class="mt-4 text-blue-700 font-semibold text-center">
    {{ resultado$ | async }}

</div>
