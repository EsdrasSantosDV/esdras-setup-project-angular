<div class="exercise-container">
  <h3>Exercise 14 - Exibindo Mensagem com Dados do Formulário</h3>

  <form [formGroup]="form" class="form-container">
    <div class="form-group">
      <label for="name">Nome:</label>
      <input type="text" id="name" formControlName="name" placeholder="Digite seu nome" />
    </div>

    <div class="form-group">
      <label for="age">Idade:</label>
      <input type="number" id="age" formControlName="age" placeholder="Digite sua idade" />
    </div>
  </form>

  <div class="message" *ngIf="message$ | async as message">
    <p>{{ message }}</p>
  </div>
</div>
