<div class="event-card">
  <div class="event-card__header">
    <div class="event-card__badge">
      <span class="badge-icon">🎉</span>
      <span class="badge-text">Evento Especial</span>
    </div>
    <div class="event-card__date">
      <span class="date-day">15</span>
      <span class="date-month">MAR</span>
    </div>
  </div>

  <div class="event-card__content">
    <h3 class="event-card__title">Conferência de Tecnologia 2024</h3>
    <p class="event-card__description">
      Uma experiência única reunindo os maiores especialistas em desenvolvimento web, 
      arquitetura de software e inovações tecnológicas.
    </p>

    <div class="event-card__details">
      <div class="detail-item">
        <span class="detail-icon">📍</span>
        <span class="detail-text">Centro de Convenções</span>
      </div>
      <div class="detail-item">
        <span class="detail-icon">🕐</span>
        <span class="detail-text">09:00 - 18:00</span>
      </div>
      <div class="detail-item">
        <span class="detail-icon">👥</span>
        <span class="detail-text">500+ Participantes</span>
      </div>
    </div>
  </div>

  <div class="event-card__footer">
    <div class="event-card__tags">
      <span class="tag tag--primary">Frontend</span>
      <span class="tag tag--secondary">Backend</span>
      <span class="tag tag--accent">DevOps</span>
    </div>
    <div class="event-card__action">
      <button class="action-button">
        <span>Ver Detalhes</span>
        <span class="arrow">→</span>
      </button>
    </div>
  </div>

  <div class="event-card__glow"></div>
</div>
